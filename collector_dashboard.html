<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Smart Recycle - Collector Dashboard</title>
    <link rel="stylesheet" href="user_profile.css"> 
    <link rel="stylesheet" href="collector_dashboard.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body style="background-color: #C4C4C4; margin: 0; display: flex; flex-direction: column; height: 100vh;">

    <header class="top-nav-green">
        <div class="logo-section-top">
            <img src="logo.png" alt="E-Smart Recycle Logo" style="width: 50px; height: auto;">
            <a href="collector_dashboard.html" style="text-decoration: none;"><h1>E-Smart Recycle</h1></a>
        </div>

        <div class="user-profile-top" style="position: relative;">
            <span id="userNameDisplay">Loading...</span>
            <div class="profile-circle-gray" onclick="toggleProfileMenu()" style="cursor: pointer;">
                <i class="fas fa-user-cog"></i>
            </div>

            <div id="profileDropdown" class="profile-dropdown">
                <a href="collector_profile.html"><i class="far fa-id-badge"></i> Profile</a>
                <a href="login_page.html" onclick="logoutUser(event)"><i class="fas fa-sign-out-alt"></i> Logout</a>
            </div>
        </div>
    </header>

    <div class="layout-container">
        
        <aside class="sidebar-left">
            <ul class="sidebar-menu">
                <li><a href="collector_dashboard.html" style="background-color: #C4C4C4;"><i class="fas fa-home"></i> Dashboard</a></li>
                <li><a href="available_requests.html"><i class="fas fa-clipboard-list"></i> Available Requests</a></li>
                <li><a href="collector_history.html"><i class="fas fa-history"></i> My Tasks</a></li>
                <li><a href="collector_notification.html"><i class="fas fa-bell"></i> Notification</a></li>
            </ul>
        </aside>

        <main class="main-content">
            <div class="submit-card" style="background-color: white; width: 100%; max-width: 900px; padding: 40px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); border-radius: 8px;">
                
                <h2 style="font-family: 'Georgia', serif; font-size: 28px; margin-top: 0; color: #333;">
                    Welcome back, <span id="welcomeName" style="color: #0d7a46;">Collector</span>!
                </h2>
                
                <div class="stats-grid">
                    <div class="stat-box">
                        <i class="fas fa-truck-loading"></i>
                        <div class="stat-info">
                            <h3>In Progress (Accepted)</h3>
                            <p id="pendingTasks">Loading...</p>
                        </div>
                    </div>
                    <div class="stat-box">
                        <i class="fas fa-check-circle"></i>
                        <div class="stat-info">
                            <h3>Total Completed</h3>
                            <p id="completedTasks">Loading...</p>
                        </div>
                    </div>
                    <div class="stat-box">
                        <i class="fas fa-weight-hanging"></i>
                        <div class="stat-info">
                            <h3>Weight Collected</h3>
                            <p id="totalWeight">Loading...</p>
                        </div>
                    </div>
                </div>

                <hr style="border: 1px solid #eee; margin: 30px 0;">

                <h3 style="font-family: 'Georgia', serif;">Quick Actions</h3>
                <div class="action-section" style="display: flex; gap: 15px;">
                    <a href="available_requests.html" class="btn-dashboard-action">
                        <i class="fas fa-search-plus"></i> Find New Requests
                    </a>
                    <a href="collector_history.html" class="btn-dashboard-action secondary">
                        <i class="fas fa-file-invoice"></i> View My Tasks
                    </a>
                </div>

            </div>
        </main>
    </div>

   <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-auth.js";
        import { getFirestore, doc, getDoc, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyC5yA_CKK4xZ8bsx-Qutca7lym6i5oJdpo",
            authDomain: "e-smartrecyclesystem.firebaseapp.com",
            projectId: "e-smartrecyclesystem",
            storageBucket: "e-smartrecyclesystem.firebasestorage.app",
            messagingSenderId: "212695525607",
            appId: "1:212695525607:web:61d0df7011aa8baf265a42"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // STRICT AUTHENTICATION GUARD
        onAuthStateChanged(auth, async (user) => {
            if (!user) {
                window.location.href = "login_page.html";
                return;
            }

            try {
                const userRef = doc(db, "users", user.uid);
                const userSnap = await getDoc(userRef);

                if (userSnap.exists()) {
                    const userData = userSnap.data();
                    
                    // ROLE-BASED ROUTING: If they are not a collector, force them to the user portal
                    if (userData.role !== "collector") {
                        console.warn("Unauthorized role detected. Redirecting...");
                        await signOut(auth); // Clear the session
                        window.location.href = "login_page.html";
                        return;
                    }
                    
                    // Update UI
                    document.getElementById('userNameDisplay').innerText = userData.fullName || "Collector";
                    document.getElementById('welcomeName').innerText = userData.fullName || "Collector";
                    
                    // Fetch Data only after role is verified
                    loadDashboardStats(user.uid);
                }
            } catch (error) {
                console.error("Auth Guard Error:", error);
            }
        });

        // EFFICIENT STATS LOADING
        async function loadDashboardStats(collectorId) {
            try {
                const q = query(collection(db, "request"), where("collectorId", "==", collectorId));
                const querySnapshot = await getDocs(q);

                let pending = 0, completed = 0, totalKg = 0;

                querySnapshot.forEach((doc) => {
                    const data = doc.data();
                    if (data.status === "accepted") pending++;
                    if (data.status === "completed") {
                        completed++;
                        totalKg += parseFloat(data.weight) || 0;
                    }
                });

                document.getElementById('pendingTasks').innerText = `${pending} Active`;
                document.getElementById('completedTasks').innerText = `${completed} Tasks`;
                document.getElementById('totalWeight').innerText = `${totalKg.toFixed(2)} Kg`;
            } catch (err) {
                console.error("Stats Loading Error:", err);
            }
        }

        // --- DROPDOWN & LOGOUT ---
        window.toggleProfileMenu = () => document.getElementById("profileDropdown").classList.toggle("show-dropdown");

        window.logoutUser = async (event) => {
            event.preventDefault();
            await signOut(auth);
            window.location.href = "login_page.html";
        };
    </script>
</body>
</html>
