<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Smart Recycle - Available Requests</title>
    
    <link rel="stylesheet" href="available_request.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

    <header>
        <div class="logo-section">
            <img src="logo.png" alt="Logo">
            <a href="collector_dashboard.html" style="text-decoration: none;"><h1>E-Smart Recycle</h1></a>
        </div>
        <div class="profile-container" id="profileContainer">
            <span id="userNameDisplay">Loading...</span>
            <div class="profile-circle" onclick="toggleMenu()"><i class="fas fa-user-cog"></i></div>
            <div class="profile-dropdown" id="dropdownMenu">
                <a href="collector_profile.html"><i class="far fa-id-badge"></i> Profile</a>
                <a href="login_page.html" onclick="logoutUser(event)"><i class="fas fa-sign-out-alt"></i> Logout</a>
            </div>
        </div>
    </header>

    <div class="layout-wrapper">
        <aside>
            <ul>
                <li><a href="collector_dashboard.html"><i class="fas fa-home" style="width: 20px;"></i> Dashboard</a></li>
                <li class="active"><a href="available_requests.html"><i class="fas fa-list" style="width: 20px;"></i> Available Requests</a></li>
                <li><a href="collector_history.html"><i class="fas fa-history" style="width: 20px;"></i> My Tasks</a></li>
                <li><a href="collector_notification.html"><i class="fas fa-bell" style="width: 20px;"></i> Notification</a></li>
            </ul>
        </aside>

        <main>
            <div class="content-card">
                <h2 style="font-family: 'Georgia', serif; font-size: 28px; margin-top: 0; margin-bottom: 25px;">Available Pickup Requests</h2>
                
                <div class="table-header-banner">
                    <span>New Requests for Collection</span>
                    <i class="fas fa-map-marker-alt"></i>
                </div>

                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th>Request ID</th>
                                <th>Preferred Date & Time</th>
                                <th>Item Type</th>
                                <th>Quantity</th>
                                <th>Pickup Address</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody id="requestsTableBody">
                            <tr><td colspan="6" style="text-align: center; padding: 30px;">Checking for available jobs...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-auth.js";
        import { getFirestore, doc, getDoc, collection, getDocs, updateDoc } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyC5yA_CKK4xZ8bsx-Qutca7lym6i5oJdpo",
            authDomain: "e-smartrecyclesystem.firebaseapp.com",
            projectId: "e-smartrecyclesystem",
            storageBucket: "e-smartrecyclesystem.firebasestorage.app",
            messagingSenderId: "212695525607",
            appId: "1:212695525607:web:61d0df7011aa8baf265a42"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                try {
                    // 1. COLLECTOR SECURITY GATEKEEPER
                    const userRef = doc(db, "users", user.uid);
                    const userSnap = await getDoc(userRef);
                    
                    if (userSnap.exists()) {
                        if (userSnap.data().role !== "collector") {
                            alert("Security Alert: Only authorized Collectors can access the Available Requests board.");
                            window.location.href = "login_page.html";
                            return; 
                        }
                        document.getElementById('userNameDisplay').innerText = userSnap.data().fullName;
                    }

                    // 2. FETCH PENDING REQUESTS
                    const querySnapshot = await getDocs(collection(db, "request"));
                    let tableHTML = "";
                    let jobCount = 0;

                    querySnapshot.forEach((docSnap) => {
                        const reqData = docSnap.data();
                        const status = reqData.status ? reqData.status.toLowerCase() : "";

                        // Only show jobs that no one has taken yet
                        if (status === "pending") {
                            jobCount++;
                            const requestId = "#" + docSnap.id.substring(0, 6).toUpperCase();
                            
                            // --- DISPLAY THE USER'S PREFERRED SCHEDULED DATE ---
                            let displayDateTime = "Not specified";
                            if (reqData.scheduledDate) {
                                const dateObj = new Date(reqData.scheduledDate);
                                displayDateTime = dateObj.toLocaleString('en-MY', { 
                                    year: 'numeric', month: 'short', day: 'numeric', 
                                    hour: '2-digit', minute: '2-digit' 
                                });
                            }

                            tableHTML += `
                                <tr id="row-${docSnap.id}">
                                    <td style="color: #666; font-weight: bold;">${requestId}</td>
                                    <td style="color: #0d7a46; font-weight: bold;">${displayDateTime}</td>
                                    <td style="text-transform: capitalize;">${reqData.category || '-'}</td>
                                    <td>${reqData.weight || '0'} Kg</td>
                                    <td style="font-size: 13px;">${reqData.pickupAddress || '-'}</td>
                                    <td>
                                        <button class="btn-accept" onclick="acceptJob('${docSnap.id}')">Accept</button>
                                    </td>
                                </tr>
                            `;
                        }
                    });

                    document.getElementById('requestsTableBody').innerHTML = tableHTML || "<tr><td colspan='6' style='text-align: center; padding: 30px;'>No new requests available right now. Check back later!</td></tr>";

                } catch (error) {
                    console.error("Database Error:", error);
                    document.getElementById('requestsTableBody').innerHTML = `<tr><td colspan='6' style='text-align: center; color: red;'>Error loading jobs: ${error.message}</td></tr>`;
                }

            } else {
                window.location.href = "login_page.html"; // Kick to login
            }
        });

        // --- ACCEPT JOB FUNCTION ---
        window.acceptJob = async function(docId) {
            const confirmAccept = confirm("Are you sure you want to accept this pickup job?");
            if (confirmAccept) {
                try {
                    await updateDoc(doc(db, "request", docId), {
                        status: "accepted",
                        collectorId: auth.currentUser.uid, 
                        updatedAt: new Date().toISOString()
                    });
                    
                    alert("Success! You have accepted the job. It has been moved to your 'My Tasks' page.");
                    document.getElementById(`row-${docId}`).style.display = 'none';
                    
                } catch (error) {
                    alert("Error accepting job: " + error.message);
                }
            }
        };

        // --- UI MENUS & LOGOUT ---
        window.toggleMenu = function() {
            document.getElementById("dropdownMenu").classList.toggle("show");
        };

        window.onclick = function(event) {
            if (!event.target.closest('#profileContainer')) {
                const dropdown = document.getElementById("dropdownMenu");
                if (dropdown.classList.contains('show')) {
                    dropdown.classList.remove('show');
                }
            }
        };

        window.logoutUser = function(event) {
            event.preventDefault();
            if (confirm("Are you sure you want to log out?")) {
                signOut(auth).then(() => {
                    window.location.href = "login_page.html";
                });
            }
        };
    </script>
</body>
</html>
