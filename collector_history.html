<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Smart Recycle - My Tasks</title>
    <link rel="stylesheet" href="user_profile.css"> 
    <link rel="stylesheet" href="collector_history.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body style="background-color: #C4C4C4; margin: 0; display: flex; flex-direction: column; height: 100vh;">

    <header class="top-nav-green">
        <div class="logo-section-top">
            <img src="logo.png" alt="E-Smart Recycle Logo" style="width: 50px; height: auto;">
            <a href="collector_dashboard.html" style="text-decoration: none;"><h1>E-Smart Recycle</h1></a>
        </div>
        <div class="user-profile-top" style="position: relative;">
            <span id="userNameDisplay">Loading...</span>
            <div class="profile-circle-gray" onclick="toggleProfileMenu()" style="cursor: pointer;">
                <i class="fas fa-user-cog"></i>
            </div>
            <div id="profileDropdown" class="profile-dropdown">
                <a href="collector_profile.html"><i class="far fa-id-badge"></i> Profile</a>
                <a href="#" onclick="logoutUser(event)"><i class="fas fa-sign-out-alt"></i> Logout</a>
            </div>
        </div>
    </header>

    <div class="layout-container">
        
        <aside class="sidebar-left">
            <ul class="sidebar-menu">
                <li><a href="collector_dashboard.html"><i class="fas fa-home"></i> Dashboard</a></li>
                <li><a href="available_requests.html"><i class="fas fa-clipboard-list"></i> Available Requests</a></li>
                <li><a href="collector_history.html" style="background-color: #C4C4C4;"><i class="fas fa-history"></i> My Tasks</a></li>
                <li><a href="collector_notification.html"><i class="fas fa-bell"></i> Notification</a></li>
            </ul>
        </aside>

        <main class="main-content">
            <div class="submit-card" style="width: 100%; max-width: 1050px; background-color: white; padding: 30px; border-radius: 4px; box-shadow: 0 4px 10px rgba(0,0,0,0.1);">
                <h2 style="font-family: 'Georgia', serif; font-size: 24px; margin-top: 0; margin-bottom: 25px;">My Tasks & History</h2>
                
                <div style="background-color: #D9D9D9; padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; font-family: 'Georgia', serif; font-size: 16px; margin-bottom: 20px;">
                    <span>Assigned and Processed Requests</span>
                    <i class="fas fa-file-alt"></i>
                </div>

                <div class="collector-table-container">
                    <table class="collector-table">
<thead>
    <tr>
        <th>Date</th>
        <th>Item Type</th>
        <th>Weight</th>
        <th>User</th> 
        <th>Pickup Address</th>
        <th>Status</th>
        <th>User Feedback</th>
    </tr>
</thead>
                        <tbody id="historyTableBody">
                            <tr>
                                <td colspan="6" style="text-align: center; padding: 20px;">Loading your tasks...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <div style="margin-top: 25px; text-align: right;">
                    <a href="collector_dashboard.html" style="color: #0d7a46; text-decoration: none; font-weight: bold;">
                        <i class="fas fa-arrow-left"></i> Return to Dashboard
                    </a>
                </div>
            </div>
        </main>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-auth.js";
        import { getFirestore, doc, getDoc, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore.js";

        // Your Firebase config
        const firebaseConfig = {
            apiKey: "AIzaSyC5yA_CKK4xZ8bsx-Qutca7lym6i5oJdpo",
            authDomain: "e-smartrecyclesystem.firebaseapp.com",
            projectId: "e-smartrecyclesystem",
            storageBucket: "e-smartrecyclesystem.firebasestorage.app",
            messagingSenderId: "212695525607",
            appId: "1:212695525607:web:61d0df7011aa8baf265a42"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                const userRef = doc(db, "users", user.uid);
                const userSnap = await getDoc(userRef);

                if (userSnap.exists()) {
                    if (userSnap.data().role !== "collector") {
                        window.location.href = "login_page.html";
                        return;
                    }
                    document.getElementById('userNameDisplay').innerText = userSnap.data().fullName || "Collector";
                }

                window.loadMyTasks(user.uid);
            } else {
                window.location.href = "login_page.html";
            }
        });

        // Function to build the table
        window.loadMyTasks = async function(collectorId) {
            const tableBody = document.getElementById('historyTableBody');
            
            try {
                const q = query(collection(db, "request"), where("collectorId", "==", collectorId));
                const querySnapshot = await getDocs(q);

                let tableHTML = "";
                let hasTasks = false;

                querySnapshot.forEach((docSnap) => {
                    hasTasks = true;
                    const reqData = docSnap.data();
                    const status = reqData.status ? reqData.status.toLowerCase() : "unknown";
                    
                    const displayDate = reqData.updatedAt ? reqData.updatedAt.substring(0, 10) : "Recent";
                    
                    let statusHTML = "";
                    let feedbackHTML = "-";

                    // 1. If accepted, show waiting badge
                    if (status === "accepted") {
                        statusHTML = `<span class="badge-accepted"><i class="fas fa-hourglass-half"></i> Waiting for User</span>`;
                        feedbackHTML = `<span style="color: #888; font-size: 12px;">Pending completion</span>`;
                    } 
                    // 2. If completed, show completed badge AND check for feedback
                    else if (status === "completed") {
                        statusHTML = `<span class="badge-completed"><i class="fas fa-check"></i> Completed</span>`;
                        
                        // Check if the user left a rating or text feedback in the database
                        const rating = reqData.rating || "No rating";
                        const feedbackText = reqData.feedback || "No written feedback provided.";

                        if (reqData.rating || reqData.feedback) {
                            // Creates a safe string for the alert popup
                            const safeFeedback = feedbackText.replace(/'/g, "\\'"); 
                            feedbackHTML = `
                                <button class="btn-view-feedback" onclick="viewFeedback('${rating}', '${safeFeedback}')">
                                    <i class="fas fa-star"></i> View Feedback
                                </button>
                            `;
                        } else {
                            feedbackHTML = `<span style="color: #888; font-size: 12px;">No feedback left</span>`;
                        }
                    }

// Inside your loadMyTasks function, replace the loop with this:
querySnapshot.forEach(async (docSnap) => {
    hasTasks = true;
    const reqData = docSnap.data();
    
    // 1. Fetch User Name based on userId in the request
    let userName = "Loading...";
    try {
        const userDoc = await getDoc(doc(db, "users", reqData.userId));
        userName = userDoc.exists() ? userDoc.data().fullName : "Unknown";
    } catch (e) {
        userName = "Error";
    }

    const status = reqData.status ? reqData.status.toLowerCase() : "unknown";
    const displayDate = reqData.updatedAt ? reqData.updatedAt.substring(0, 10) : "Recent";
    
    // ... (keep your existing statusHTML and feedbackHTML logic) ...

    if (status === "accepted" || status === "completed") {
        tableHTML += `
            <tr>
                <td>${displayDate}</td>
                <td style="text-transform: capitalize;">${reqData.category || '-'}</td>
                <td style="font-weight: bold;">${reqData.weight || '0'} Kg</td>
                <td>${userName}</td> <td>${reqData.pickupAddress || reqData.address || '-'}</td>
                <td>${statusHTML}</td>
                <td>${feedbackHTML}</td>
            </tr>
        `;
    }
});

                if (!hasTasks || tableHTML === "") {
                    tableBody.innerHTML = "<tr><td colspan='6' style='text-align: center; padding: 20px; color: #666;'>You have not accepted any tasks yet. Go to 'Available Requests' to find jobs!</td></tr>";
                } else {
                    tableBody.innerHTML = tableHTML;
                }

            } catch (error) {
                console.error("Error loading tasks:", error);
                tableBody.innerHTML = "<tr><td colspan='6' style='text-align: center; color: red;'>Error loading data.</td></tr>";
            }
        };

        // --- VIEW FEEDBACK FUNCTION ---
        window.viewFeedback = function(rating, feedbackText) {
            alert(`User Rating: ${rating} \n\nUser Comment: "${feedbackText}"`);
        };

        // --- DROPDOWN & LOGOUT FUNCTIONS ---
        window.toggleProfileMenu = function() {
            document.getElementById("profileDropdown").classList.toggle("show-dropdown");
        };

        window.onclick = function(event) {
            if (!event.target.matches('.profile-circle-gray') && !event.target.matches('.fa-user-cog') && !event.target.matches('.profile-circle')) {
                const dropdowns = document.getElementsByClassName("profile-dropdown");
                for (let i = 0; i < dropdowns.length; i++) {
                    if (dropdowns[i].classList.contains('show-dropdown')) {
                        dropdowns[i].classList.remove('show-dropdown');
                    }
                }
            }
        };

        window.logoutUser = function(event) {
            event.preventDefault();
            signOut(auth).then(() => {
                window.location.href = "login_page.html";
            });
        };
    </script>
</body>
</html>
