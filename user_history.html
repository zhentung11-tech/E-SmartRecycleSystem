<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Smart Recycle - Request History</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="style.css"> 
    
    <link rel="stylesheet" href="user_history.css"> 
</head>
<body style="background-color: #C4C4C4; margin: 0; display: flex; flex-direction: column; height: 100vh;">

    <header style="background-color: #8CC63F; display: flex; justify-content: space-between; align-items: center; padding: 10px 30px; height: 60px;">
        <div style="display: flex; align-items: center; gap: 15px;">
            <img src="logo.png" alt="E-Smart Recycle Logo" style="width: 50px; height: auto; background-color: white; padding: 5px;">
            <a href="dashboard.html" style="text-decoration: none;"><h1 style="margin: 0; font-size: 22px; color: #000; font-family: Arial, sans-serif;">E-Smart Recycle</h1></a>
        </div>

        <div style="display: flex; align-items: center; gap: 15px; font-family: Arial, sans-serif;">
            <span id="userNameDisplay">Loading...</span>
            
            <div class="profile-dropdown-container">
                <div class="profile-circle-gray" onclick="toggleProfileMenu()">
                    <i class="fas fa-user"></i>
                </div>
                
                <div class="profile-dropdown" id="profileDropdown">
                    <a href="user_profile.html"><i class="fas fa-user-circle"></i> Profile</a>
                    <a href="login_page.html" onclick="logoutUser(event)"><i class="fas fa-sign-out-alt"></i> Logout</a>
                </div>
            </div>
        </div>
    </header>

    <div style="display: flex; flex: 1; overflow: hidden;">
        
<aside style="width: 250px; background-color: #E0E0E0; padding-top: 20px;">
    <ul style="list-style: none; padding: 0; margin: 0; font-family: Arial, sans-serif;">
        <li><a href="dashboard.html" style="display: flex; align-items: center; gap: 15px; padding: 15px 25px; text-decoration: none; color: #333;"><i class="fas fa-home" style="width: 20px;"></i> Dashboard</a></li>
        <li><a href="selectpickup.html" style="display: flex; align-items: center; gap: 15px; padding: 15px 25px; text-decoration: none; color: #333;"><i class="fas fa-box" style="width: 20px;"></i> Submit Item</a></li>
        <li><a href="user_history.html" style="display: flex; align-items: center; gap: 15px; padding: 15px 25px; text-decoration: none; color: #333; font-weight: bold;"><i class="fas fa-history" style="width: 20px;"></i> Request History</a></li>
        
        <li><a href="user_feedback.html" style="display: flex; align-items: center; gap: 15px; padding: 15px 25px; text-decoration: none; color: #333;"><i class="fas fa-star" style="width: 20px;"></i> Rate Service</a></li>
        
        <li><a href="user_notification.html" style="display: flex; align-items: center; gap: 15px; padding: 15px 25px; text-decoration: none; color: #333;"><i class="fas fa-bell" style="width: 20px;"></i> Notification</a></li>
    </ul>
</aside>

        <main style="flex: 1; padding: 40px; overflow-y: auto; display: flex; justify-content: center; align-items: flex-start;">
            <div style="background-color: white; width: 100%; max-width: 950px; padding: 40px; border-radius: 4px; box-shadow: 0 4px 10px rgba(0,0,0,0.1);">
                
                <h2 style="font-family: 'Georgia', serif; font-size: 28px; margin-top: 0; margin-bottom: 25px;">My Request History</h2>
                
                <div style="background-color: #D9D9D9; padding: 15px 20px; font-family: 'Georgia', serif; font-size: 16px; margin-bottom: 20px;">
                    Record of Submitted Items
                </div>

                <div style="background-color: #E2E2E2; padding: 20px; border-radius: 4px;">
                    <table class="history-table">
                        <thead>
                            <tr>
                                <th>Request ID</th>
                                <th>Date Submitted</th>
                                <th>Item Type</th>
                                <th>Quantity</th>
                                <th>Collector</th>
                                <th>Status</th>
                            </tr>
                        </thead>
                        <tbody id="historyTableBody">
                            <tr>
                                <td colspan="6" style="text-align: center; padding: 30px;">Loading history...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>

            </div>
        </main>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-auth.js";
        import { getFirestore, doc, getDoc, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore.js";

        // Your exact Firebase config
        const firebaseConfig = {
            apiKey: "AIzaSyC5yA_CKK4xZ8bsx-Qutca7lym6i5oJdpo",
            authDomain: "e-smartrecyclesystem.firebaseapp.com",
            projectId: "e-smartrecyclesystem",
            storageBucket: "e-smartrecyclesystem.firebasestorage.app",
            messagingSenderId: "212695525607",
            appId: "1:212695525607:web:61d0df7011aa8baf265a42"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                try {
                    // 1. FETCH USER NAME FOR TOP RIGHT
                    const userRef = doc(db, "users", user.uid);
                    const userSnap = await getDoc(userRef);
                    if (userSnap.exists()) {
                        document.getElementById('userNameDisplay').innerText = userSnap.data().fullName;
                    }

                    // 2. CREATE COLLECTOR DICTIONARY
                    const allUsersSnap = await getDocs(collection(db, "users"));
                    const collectorDictionary = {};
                    allUsersSnap.forEach(doc => {
                        collectorDictionary[doc.id] = doc.data().fullName || "Unknown";
                    });

                    // 3. FETCH ONLY THIS USER'S REQUESTS
                    const q = query(collection(db, "request"), where("userId", "==", user.uid));
                    const querySnapshot = await getDocs(q);

                    let recordsArray = [];

                    // 4. LOOP THROUGH REQUESTS
                    querySnapshot.forEach((docSnap) => {
                        const reqData = docSnap.data();
                        const status = reqData.status ? reqData.status.toLowerCase() : "pending";
                        
                        const requestId = "#" + docSnap.id.substring(0, 6).toUpperCase();

                        let sortValue = 0;
                        let displayDate = "N/A";
                        let rawDate = reqData.createdAt;

                        if (rawDate) {
                            if (rawDate.toDate) { 
                                sortValue = rawDate.toDate().getTime(); 
                                displayDate = rawDate.toDate().toLocaleDateString(); 
                            } else { 
                                sortValue = new Date(rawDate).getTime();
                                displayDate = String(rawDate).substring(0, 10);
                            }
                        }

                        let assignedCollector = "<span style='color: #888;'>Waiting...</span>";
                        if (reqData.collectorId && collectorDictionary[reqData.collectorId]) {
                            assignedCollector = `<strong>${collectorDictionary[reqData.collectorId]}</strong>`;
                        }

                        let badgeStyles = "padding: 6px 15px; border-radius: 4px; font-size: 13px; font-weight: bold; color: white; display: inline-block; min-width: 80px; text-align: center;";
                        let displayStatus = "Pending";
                        
                        if (status === "pending") {
                            badgeStyles += "background-color: #f59e0b;"; 
                        } else if (status === "accepted") {
                            displayStatus = "Accepted";
                            badgeStyles += "background-color: #10b981;"; 
                        } else if (status === "completed") {
                            displayStatus = "Completed";
                            badgeStyles += "background-color: #047857;"; 
                        }

                        recordsArray.push({
                            timestamp: sortValue,
                            html: `
                                <tr>
                                    <td style="color: #555;">${requestId}</td>
                                    <td>${displayDate}</td>
                                    <td style="text-transform: capitalize;">${reqData.category || '-'}</td>
                                    <td>${reqData.weight || '0'} Kg</td>
                                    <td>${assignedCollector}</td>
                                    <td><span style="${badgeStyles}">${displayStatus}</span></td>
                                </tr>
                            `
                        });
                    });

                    // 5. SORT AND DISPLAY
                    recordsArray.sort((a, b) => b.timestamp - a.timestamp);

                    let tableHTML = "";
                    recordsArray.forEach(record => {
                        tableHTML += record.html;
                    });

                    document.getElementById('historyTableBody').innerHTML = tableHTML || "<tr><td colspan='6' style='text-align: center; padding: 30px;'>You have no request history yet.</td></tr>";

                } catch (error) {
                    console.error("Database Error:", error);
                    document.getElementById('historyTableBody').innerHTML = `<tr><td colspan='6' style='text-align: center; color: red;'>Error loading history: ${error.message}</td></tr>`;
                }

            } else {
                window.location.href = "login_page.html"; // Kick to login
            }
        });

        // --- FIXED DROPDOWN & LOGOUT FUNCTIONS ---
        window.toggleProfileMenu = function() {
            document.getElementById("profileDropdown").classList.toggle("show-dropdown");
        };

        window.onclick = function(event) {
            if (!event.target.closest('.profile-dropdown-container')) {
                const dropdowns = document.getElementsByClassName("profile-dropdown");
                for (let i = 0; i < dropdowns.length; i++) {
                    if (dropdowns[i].classList.contains('show-dropdown')) {
                        dropdowns[i].classList.remove('show-dropdown');
                    }
                }
            }
        };

        window.logoutUser = function(event) {
            event.preventDefault(); 
            const confirmLogout = confirm("Are you sure you want to log out?");
            
            if (confirmLogout) {
                signOut(auth).then(() => {
                    window.location.href = "login_page.html"; 
                }).catch((error) => {
                    alert("Error logging out: " + error.message);
                });        
            }
        };

        // 1. Calculate time
const TWO_MINUTES_AGO = new Date().getTime() - (1 * 60 * 1000);
const requestTime = data.createdAt?.toDate ? data.createdAt.toDate().getTime() : new Date(data.createdAt).getTime();

// 2. Determine display status
let displayStatus = data.status; // e.g., "pending"
let statusClass = "text-yellow-600"; // Default styling

if (data.status === "pending" && requestTime < THREE_DAYS_AGO) {
    displayStatus = "Expired";
    statusClass = "text-red-600 font-bold";
}

// 3. Render in HTML
tbody.innerHTML += `
    <tr>
        <td>${data.category}</td>
        <td>${data.weight} kg</td>
        <td class="${statusClass}">${displayStatus}</td>
    </tr>
`;
        
    </script>
</body>
</html>
