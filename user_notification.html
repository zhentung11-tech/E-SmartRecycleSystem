<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Notifications - E-Smart Recycle</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .alert-card {
            background: #fff5f5;
            border-left: 5px solid #ef4444;
            padding: 20px;
            margin-bottom: 15px;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .btn-reorder {
            background: #ef4444;
            color: white;
            padding: 8px 15px;
            text-decoration: none;
            border-radius: 4px;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <main style="max-width: 800px; margin: 40px auto; padding: 20px;">
        <h2>Notifications</h2>
        <div id="notificationContainer">
            </div>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-auth.js";
        import { getFirestore, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore.js";

        const db = getFirestore(initializeApp({ /* YOUR CONFIG */ }));
        
        onAuthStateChanged(getAuth(), async (user) => {
            if (!user) return;
            
            const container = document.getElementById('notificationContainer');
            const q = query(collection(db, "request"), where("userId", "==", user.uid), where("status", "==", "pending"));
            const snapshot = await getDocs(q);
            
            // Testing threshold: 2 minutes
            const EXPIRATION_LIMIT = 2 * 60 * 1000; 
            const now = new Date().getTime();
            let hasAlert = false;

            snapshot.forEach((doc) => {
                const data = doc.data();
                const requestTime = data.createdAt?.toDate ? data.createdAt.toDate().getTime() : new Date(data.createdAt).getTime();

                if (now - requestTime > EXPIRATION_LIMIT) {
                    hasAlert = true;
                    container.innerHTML += `
                        <div class="alert-card">
                            <div>
                                <i class="fa-solid fa-exclamation-circle" style="color: #ef4444; margin-right: 10px;"></i>
                                <strong>Request Expired!</strong><br>
                                Your request for <strong>${data.category}</strong> (${data.weight}kg) has expired.
                            </div>
                            <a href="selectpickup.html" class="btn-reorder">Re-request</a>
                        </div>
                    `;
                }
            });

            if (!hasAlert) {
                container.innerHTML = "<p>No new notifications.</p>";
            }
        });
    </script>
</body>
</html>
