<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Smart Recycle - Notifications</title>
    <link href="https://fonts.googleapis.com/css2?family=Segoe+UI:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

<link rel="stylesheet" href="user_notification.css"> 
</head>
<body style="background-color: #C4C4C4; margin: 0; display: flex; flex-direction: column; height: 100vh;">

    <header style="background-color: #8CC63F; display: flex; justify-content: space-between; align-items: center; padding: 10px 30px; height: 60px;">
        <div style="display: flex; align-items: center; gap: 15px;">
            <img src="logo.png" alt="E-Smart Recycle Logo" style="width: 50px; height: auto; background-color: white; padding: 5px;">
            <a href="dashboard.html" style="text-decoration: none;"><h1 style="margin: 0; font-size: 22px; color: #000; font-family: Arial, sans-serif;">E-Smart Recycle</h1></a>
        </div>

        <div style="display: flex; align-items: center; gap: 15px; font-family: Arial, sans-serif;">
            <span id="userNameDisplay">Loading...</span>
            
            <div class="profile-dropdown-container">
                <div class="profile-circle-gray" onclick="toggleProfileMenu()">
                    <i class="fas fa-user"></i>
                </div>
                
                <div class="profile-dropdown" id="profileDropdown">
                    <a href="user_profile.html"><i class="fas fa-user-circle"></i> Profile</a>
                    <a href="login_page.html" onclick="logoutUser(event)"><i class="fas fa-sign-out-alt"></i> Logout</a>
                </div>
            </div>
        </div>
    </header>

    <div style="display: flex; flex: 1; overflow: hidden;">
        
<aside style="width: 250px; background-color: #E0E0E0; padding-top: 20px;">
    <ul style="list-style: none; padding: 0; margin: 0; font-family: Arial, sans-serif;">
        <li><a href="dashboard.html" style="display: flex; align-items: center; gap: 15px; padding: 15px 25px; text-decoration: none; color: #333;"><i class="fas fa-home" style="width: 20px;"></i> Dashboard</a></li>
        <li><a href="selectpickup.html" style="display: flex; align-items: center; gap: 15px; padding: 15px 25px; text-decoration: none; color: #333;"><i class="fas fa-box" style="width: 20px;"></i> Submit Item</a></li>
        <li><a href="user_history.html" style="display: flex; align-items: center; gap: 15px; padding: 15px 25px; text-decoration: none; color: #333; font-weight: bold;"><i class="fas fa-history" style="width: 20px;"></i> Request History</a></li>
        
        <li><a href="user_feedback.html" style="display: flex; align-items: center; gap: 15px; padding: 15px 25px; text-decoration: none; color: #333;"><i class="fas fa-star" style="width: 20px;"></i> Rate Service</a></li>
        
        <li><a href="user_notification.html" style="display: flex; align-items: center; gap: 15px; padding: 15px 25px; text-decoration: none; color: #333;"><i class="fas fa-bell" style="width: 20px;"></i> Notification</a></li>
    </ul>
</aside>
    
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background-color: #f4f4f4; margin: 0; padding: 0; }
        .notif-container { max-width: 800px; margin: 40px auto; padding: 20px; }
        
        /* Notification Card */
        .notif-item {
            background: white;
            padding: 20px;
            margin-bottom: 15px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            border-left: 6px solid #ccc;
            transition: opacity 0.3s ease;
        }

        .notif-item.read { opacity: 0.6; }
        .alert-card { border-left-color: #ef4444; background: #fff5f5; }
        .status-card { border-left-color: #0d7a46; background: #eef7f2; }

        .btn-reorder {
            background: #ef4444;
            color: white;
            padding: 8px 15px;
            text-decoration: none;
            border-radius: 4px;
            font-size: 14px;
            font-weight: bold;
        }
        .btn-reorder:hover { background: #dc2626; }
        
        #markReadBtn { 
            cursor: pointer; padding: 8px 16px; 
            background: #8CC63F; border: none; 
            color: white; border-radius: 4px; 
            font-weight: bold; 
        }
    </style>
</head>
<body>

    <main class="notif-container">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <h2>My Notifications</h2>
            <button id="markReadBtn" onclick="markAllAsRead()">Mark all as read</button>
        </div>
        <div id="notifList">
            <p style="text-align: center; color: #888;">Loading your notifications...</p>
        </div>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-auth.js";
    import { getFirestore, doc, getDoc, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyC5yA_CKK4xZ8bsx-Qutca7lym6i5oJdpo",
            authDomain: "e-smartrecyclesystem.firebaseapp.com",
            projectId: "e-smartrecyclesystem",
            storageBucket: "e-smartrecyclesystem.firebasestorage.app",
            messagingSenderId: "212695525607",
            appId: "1:212695525607:web:61d0df7011aa8baf265a42"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(initializeApp(firebaseConfig));

        onAuthStateChanged(getAuth(), async (user) => {
            if (!user) { window.location.href = "login_page.html"; return; }
            
            const container = document.getElementById('notifList');
            container.innerHTML = ""; // Clear loader
            
            const EXPIRY_LIMIT = 2 * 60 * 1000; // 2 Min
            const now = new Date().getTime();

            const q = query(collection(db, "request"), where("userId", "==", user.uid));
            const snapshot = await getDocs(q);

            // Add Welcome Message
            container.innerHTML += `
                <div class="notif-item">
                    <div><h3 style="margin:0;">Welcome to E-Smart Recycle</h3><p style="margin:5px 0 0 0;">We're happy to have you on board!</p></div>
                </div>`;

            snapshot.forEach((doc) => {
                const data = doc.data();
                const reqTime = data.createdAt?.toDate ? data.createdAt.toDate().getTime() : new Date(data.createdAt).getTime();
                const status = data.status ? data.status.toLowerCase() : "pending";

                if (status === "pending" && (now - reqTime > EXPIRY_LIMIT)) {
                    container.innerHTML += `
                        <div class="notif-item alert-card">
                            <div>
                                <i class="fa-solid fa-triangle-exclamation" style="color:#ef4444; margin-right: 10px;"></i>
                                <strong>Request Expired:</strong> Your ${data.category} (${data.weight} kg) request was not collected.
                            </div>
                            <a href="selectpickup.html" class="btn-reorder">Re-request</a>
                        </div>`;
                } else if (status === "accepted" || status === "completed") {
                    container.innerHTML += `
                        <div class="notif-item status-card">
                            <div>
                                <i class="fa-solid fa-check-circle" style="color:#0d7a46; margin-right: 10px;"></i>
                                <strong>Pickup ${status.charAt(0).toUpperCase() + status.slice(1)}!</strong>
                                <p style="margin:5px 0 0 0;">Your ${data.category} request has been ${status}.</p>
                            </div>
                        </div>`;
                }
            });
        });

        window.markAllAsRead = () => {
            document.querySelectorAll('.notif-item').forEach(el => el.classList.add('read'));
            const btn = document.getElementById('markReadBtn');
            btn.innerText = "All caught up!";
            btn.style.background = "#ccc";
        };

        window.toggleProfileMenu = () => document.getElementById("profileDropdown").classList.toggle("show-dropdown");
    window.logoutUser = (e) => { e.preventDefault(); signOut(auth).then(() => window.location.href = "login_page.html"); 
    
            // --- FIXED DROPDOWN & LOGOUT FUNCTIONS ---
        window.toggleProfileMenu = function() {
            document.getElementById("profileDropdown").classList.toggle("show-dropdown");
        };

        window.onclick = function(event) {
            // Check if clicking outside the entire user profile area
            if (!event.target.closest('.user-profile-top')) {
                const dropdowns = document.getElementsByClassName("profile-dropdown");
                for (let i = 0; i < dropdowns.length; i++) {
                    if (dropdowns[i].classList.contains('show-dropdown')) {
                        dropdowns[i].classList.remove('show-dropdown');
                    }
                }
            }
        };

        window.logoutUser = function(event) {
            event.preventDefault(); // Stops the browser from fast-jumping!
            
            const confirmLogout = confirm("Are you sure you want to log out?");
            
            if (confirmLogout) {
                signOut(auth).then(() => {
                    // Sign-out successful, NOW we send them to the login page
                    window.location.href = "login_page.html"; 
                }).catch((error) => {
                    alert("Error logging out: " + error.message);
                });
            }    
        };
    </script>
</body>
</html>
