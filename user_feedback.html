<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Smart Recycle - Rate Service</title>
    
    <link rel="stylesheet" href="style.css"> 
    <link rel="stylesheet" href="user_feedback.css"> 
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body style="background-color: #C4C4C4; margin: 0; display: flex; flex-direction: column; height: 100vh;">

    <header style="background-color: #8CC63F; display: flex; justify-content: space-between; align-items: center; padding: 10px 30px; height: 60px;">
        <div style="display: flex; align-items: center; gap: 15px;">
            <img src="logo.png" alt="E-Smart Recycle Logo" style="width: 50px; height: auto; background-color: white; padding: 5px; border-radius: 4px;">
            <a href="dashboard.html" style="text-decoration: none;"><h1 style="margin: 0; font-size: 22px; color: #000; font-family: Arial, sans-serif;">E-Smart Recycle</h1></a>
        </div>

        <div style="display: flex; align-items: center; gap: 15px; font-family: Arial, sans-serif; position: relative;">
            <span id="userNameDisplay">Loading...</span>
            <div class="profile-circle" onclick="toggleProfileMenu()" style="background-color: #545454; color: white; width: 35px; height: 35px; border-radius: 50%; display: flex; justify-content: center; align-items: center; cursor: pointer;">
                <i class="fas fa-user"></i>
            </div>
            
            <div id="profileDropdown" style="display: none; position: absolute; right: 0; top: 50px; background-color: white; min-width: 160px; box-shadow: 0px 4px 12px rgba(0,0,0,0.15); border-radius: 4px; z-index: 1000; flex-direction: column;">
                <a href="user_profile.html" style="color: #333; padding: 12px 20px; text-decoration: none; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid #eee;"><i class="fas fa-user-circle"></i> Profile</a>
                <a href="#" onclick="logoutUser(event)" style="color: #333; padding: 12px 20px; text-decoration: none; display: flex; align-items: center; gap: 10px;"><i class="fas fa-sign-out-alt"></i> Logout</a>
            </div>
        </div>
    </header>

    <div style="display: flex; flex: 1; overflow: hidden;">
        
        <aside style="width: 250px; background-color: #E0E0E0; padding-top: 20px;">
            <ul style="list-style: none; padding: 0; margin: 0; font-family: Arial, sans-serif;">
                <li><a href="dashboard.html" style="display: flex; align-items: center; gap: 15px; padding: 15px 25px; text-decoration: none; color: #333;"><i class="fas fa-home" style="width: 20px;"></i> Dashboard</a></li>
                <li><a href="selectpickup.html" style="display: flex; align-items: center; gap: 15px; padding: 15px 25px; text-decoration: none; color: #333;"><i class="fas fa-box" style="width: 20px;"></i> Submit Item</a></li>
                <li><a href="user_history.html" style="display: flex; align-items: center; gap: 15px; padding: 15px 25px; text-decoration: none; color: #333;"><i class="fas fa-history" style="width: 20px;"></i> Request History</a></li>
                
                <li style="background-color: #C4C4C4;"><a href="user_feedback.html" style="display: flex; align-items: center; gap: 15px; padding: 15px 25px; text-decoration: none; color: #333; font-weight: bold;"><i class="fas fa-star" style="width: 20px;"></i> Rate Service</a></li>
                
                <li><a href="user_notification.html" style="display: flex; align-items: center; gap: 15px; padding: 15px 25px; text-decoration: none; color: #333;"><i class="fas fa-bell" style="width: 20px;"></i> Notification</a></li>
            </ul>
        </aside>

        <main style="flex: 1; padding: 40px; overflow-y: auto; display: flex; justify-content: center; align-items: flex-start;">
            <div style="background-color: white; width: 100%; max-width: 800px; padding: 40px; border-radius: 4px; box-shadow: 0 4px 10px rgba(0,0,0,0.1);">
                
                <h2 style="font-family: 'Georgia', serif; font-size: 28px; margin-top: 0; margin-bottom: 10px;">Pending Completions</h2>
                <p style="color: #666; margin-bottom: 30px;">Please confirm that the collector has picked up your items and rate their service.</p>
                
                <div id="feedbackContainer">
                    <p style="text-align: center; padding: 40px; color: #888;">Scanning for pending jobs...</p>
                </div>

            </div>
        </main>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-auth.js";
        import { getFirestore, doc, getDoc, collection, query, where, getDocs, updateDoc } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyC5yA_CKK4xZ8bsx-Qutca7lym6i5oJdpo",
            authDomain: "e-smartrecyclesystem.firebaseapp.com",
            projectId: "e-smartrecyclesystem",
            storageBucket: "e-smartrecyclesystem.firebasestorage.app",
            messagingSenderId: "212695525607",
            appId: "1:212695525607:web:61d0df7011aa8baf265a42"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                const userRef = doc(db, "users", user.uid);
                const userSnap = await getDoc(userRef);
                if (userSnap.exists()) {
                    document.getElementById('userNameDisplay').innerText = userSnap.data().fullName;
                }

                loadPendingFeedback(user.uid);

            } else {
                window.location.href = "login_page.html"; 
            }
        });

        async function loadPendingFeedback(userId) {
            const container = document.getElementById('feedbackContainer');
            
            try {
                const q = query(collection(db, "request"), where("userId", "==", userId));
                const querySnapshot = await getDocs(q);
                
                let cardsHTML = "";
                let pendingCount = 0;

                querySnapshot.forEach((docSnap) => {
                    const reqData = docSnap.data();
                    const status = reqData.status ? reqData.status.toLowerCase() : "";

                    if (status === "accepted") {
                        pendingCount++;
                        const shortId = "#" + docSnap.id.substring(0, 6).toUpperCase();
                        
                        cardsHTML += `
                            <div class="feedback-card" id="card-${docSnap.id}">
                                <div class="job-details">
                                    <strong>Request ID:</strong> ${shortId} <br>
                                    <strong>Item Collected:</strong> <span style="text-transform: capitalize;">${reqData.category || 'Recyclables'}</span> (${reqData.weight || 0} Kg)<br>
                                    <strong>Date Scheduled:</strong> ${reqData.scheduledDate || 'Not specified'}
                                </div>
                                
                                <h3 style="margin-top: 0; color: #333; font-family: 'Georgia', serif;">Rate the Collector</h3>
                                
                                <div class="stars" style="justify-content: flex-start;">
                                    <input type="radio" id="star5-${docSnap.id}" name="rating-${docSnap.id}" value="5">
                                    <label for="star5-${docSnap.id}" title="5 stars"><i class="fas fa-star"></i></label>
                                    
                                    <input type="radio" id="star4-${docSnap.id}" name="rating-${docSnap.id}" value="4">
                                    <label for="star4-${docSnap.id}" title="4 stars"><i class="fas fa-star"></i></label>
                                    
                                    <input type="radio" id="star3-${docSnap.id}" name="rating-${docSnap.id}" value="3">
                                    <label for="star3-${docSnap.id}" title="3 stars"><i class="fas fa-star"></i></label>
                                    
                                    <input type="radio" id="star2-${docSnap.id}" name="rating-${docSnap.id}" value="2">
                                    <label for="star2-${docSnap.id}" title="2 stars"><i class="fas fa-star"></i></label>
                                    
                                    <input type="radio" id="star1-${docSnap.id}" name="rating-${docSnap.id}" value="1">
                                    <label for="star1-${docSnap.id}" title="1 star"><i class="fas fa-star"></i></label>
                                </div>

                                <textarea id="comment-${docSnap.id}" class="feedback-textarea" placeholder="Add any comments about the pickup service..."></textarea>
                                
                                <button class="btn-submit-feedback" onclick="submitFeedback('${docSnap.id}')">
                                    <i class="fas fa-check-circle"></i> Confirm Pickup & Submit
                                </button>
                            </div>
                        `;
                    }
                });

                if (pendingCount === 0) {
                    container.innerHTML = `
                        <div style="text-align: center; padding: 40px; background-color: #f9f9f9; border-radius: 8px; border: 1px dashed #ccc;">
                            <i class="fas fa-clipboard-check" style="font-size: 40px; color: #8CC63F; margin-bottom: 15px;"></i>
                            <h3 style="margin: 0; color: #333;">All Caught Up!</h3>
                            <p style="color: #666; margin-top: 10px;">You have no pending collections waiting for feedback.</p>
                        </div>
                    `;
                } else {
                    container.innerHTML = cardsHTML;
                }

            } catch (error) {
                console.error("Error fetching feedback jobs:", error);
                container.innerHTML = "<p style='color: red;'>Error loading data. Please try again.</p>";
            }
        }

        window.submitFeedback = async function(docId) {
            const selectedStar = document.querySelector(`input[name="rating-${docId}"]:checked`);
            const feedbackText = document.getElementById(`comment-${docId}`).value;

            if (!selectedStar) {
                alert("Please select a star rating before confirming the pickup.");
                return;
            }

            const ratingValue = selectedStar.value + " Stars";

            try {
                await updateDoc(doc(db, "request", docId), {
                    status: "completed",
                    rating: ratingValue,
                    feedback: feedbackText,
                    completedAt: new Date().toLocaleString()
                });

                alert("Thank you! The job is now complete, and your feedback has been recorded.");
                document.getElementById(`card-${docId}`).style.display = "none";

            } catch (error) {
                alert("Error saving feedback: " + error.message);
            }
        };

        // --- DROPDOWN & LOGOUT FUNCTIONS ---
        window.toggleProfileMenu = function() {
            const dropdown = document.getElementById("profileDropdown");
            dropdown.style.display = dropdown.style.display === "none" ? "flex" : "none";
        };
        
        window.onclick = function(event) {
            if (!event.target.closest('.profile-circle') && !event.target.closest('#profileDropdown')) {
                document.getElementById("profileDropdown").style.display = "none";
            }
        };
        
        window.logoutUser = function(event) {
            event.preventDefault(); 
            if (confirm("Are you sure you want to log out?")) {
                signOut(auth).then(() => { window.location.href = "login_page.html"; });
            }
        };
    </script>
</body>
</html>
