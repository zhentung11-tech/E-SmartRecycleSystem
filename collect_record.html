<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Smart Recycle - Collect Records</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="collect_record.css">
    <style>
        /* Profile Dropdown Setup for this specific layout */
        .user-section { position: relative; cursor: pointer; display: flex; align-items: center; gap: 10px; }
        .profile-dropdown {
            display: none; position: absolute; top: 55px; right: 0; background-color: white; 
            min-width: 160px; box-shadow: 0 4px 15px rgba(0,0,0,0.2); border-radius: 6px; z-index: 1000; flex-direction: column;
        }
        .profile-dropdown a { color: #333; padding: 15px 20px; text-decoration: none; display: flex; align-items: center; gap: 12px; font-size: 15px; border-bottom: 1px solid #f0f0f0; }
        .profile-dropdown a:hover { background-color: #f9f9f9; color: #1a8a4c; }
        .show-dropdown { display: flex !important; }
    </style>
</head>
<body>

    <div class="app-container">
        <header class="header" style="display: flex; justify-content: space-between; align-items: center; padding: 10px 30px;">
            
            <div class="logo-section" style="display: flex; align-items: center; gap: 15px;">
                <img src="logo.png" alt="E-Smart Recycle Logo" style="width: 50px; height: auto;">            
                <a href="admin_dashboard.html" style="text-decoration: none; color: inherit;">
                    <h1 style="margin: 0; font-size: 22px;">E-Smart Recycle</h1>
                </a>
            </div>
            
            <div class="user-section" onclick="toggleProfileMenu()">
                <span class="user-name" id="userNameDisplay">Loading...</span>
                <div class="avatar" style="background-color: #555; color: white; width: 35px; height: 35px; border-radius: 50%; display: flex; justify-content: center; align-items: center;">
                    <i class="fa-solid fa-user-shield"></i>
                </div>
                
                <div id="profileDropdown" class="profile-dropdown">
                    <a href="admin_profile.html"><i class="far fa-id-badge"></i> Profile</a>
                    <a href="#" onclick="logoutUser(event)"><i class="fas fa-sign-out-alt"></i> Logout</a>
                </div>
            </div>
        </header>

        <nav class="navbar">
            <a href="admin_dashboard.html" class="nav-link"><i class="fa-solid fa-house"></i> Dashboard</a>
            <a href="adminusermanagement.html" class="nav-link"><i class="fa-regular fa-user"></i> Account</a>
            <a href="collect_record.html" class="nav-link active"><i class="fa-solid fa-clipboard-list"></i> Collector Records</a>
            <a href="admin_report.html" class="nav-link"><i class="fa-solid fa-chart-bar"></i> Reports</a>
            <a href="admin_notification.html" class="nav-link"><i class="fa-regular fa-bell"></i> Notification</a>
        </nav>

        <main class="main-content">
            <div class="content-card">
                <h1>Collector Records</h1>

                <div class="controls">
                    <input type="text" class="search-box" id="searchInput" onkeyup="filterTable()" placeholder="Search by Collector, Location, or Item...">
                    
                    <select class="dropdown" id="statusFilter" onchange="filterTable()">
                        <option value="all" selected>Filter by Status: All</option>
                        <option value="completed">Completed</option>
                        <option value="pending">In Progress (Accepted)</option>
                    </select>
                </div>

                <div class="table-wrapper">
                    <table>
                        <thead>
                            <tr>
                                <th>Date Assigned</th>
                                <th>Collector Name</th>
                                <th>Location</th>
                                <th>Items Collected</th>
                                <th>Total Weight (kg)</th>
                                <th>Status</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody id="recordTableBody">
                            <tr>
                                <td colspan="7" style="text-align: center; padding: 20px;">Loading collector records from database...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>

            </div>
        </main>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-auth.js";
        import { getFirestore, doc, getDoc, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore.js";

        // ... (Keep your firebaseConfig) ...
        const firebaseConfig = { /* ... your config ... */ };
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        onAuthStateChanged(auth, async (user) => {
            if (!user) { window.location.href = "index.html"; return; }
            
            const userSnap = await getDoc(doc(db, "users", user.uid));
            if (userSnap.exists() && userSnap.data().role === "admin") {
                document.getElementById('userNameDisplay').innerText = userSnap.data().fullName;
                loadCollectorRecords();
            } else {
                alert("Access Denied.");
                window.location.href = "index.html";
            }
        });

       async function loadCollectorRecords() {
    const tableBody = document.getElementById('recordTableBody');
    console.log("Starting to fetch records..."); // Debug line 1

    try {
        const usersSnap = await getDocs(collection(db, "users"));
        const userDictionary = {};
        usersSnap.forEach(doc => {
            userDictionary[doc.id] = doc.data().fullName || "Unknown";
        });

        // Debug: Check if 'request' collection exists
        const requestSnap = await getDocs(collection(db, "request"));
        console.log("Number of documents found:", requestSnap.size); // Debug line 2

        if (requestSnap.empty) {
            tableBody.innerHTML = "<tr><td colspan='7' style='text-align: center;'>No data found in 'request' collection.</td></tr>";
            return;
        }

        let tableHTML = "";
        requestSnap.forEach((docSnap) => {
            const reqData = docSnap.data();
            console.log("Document Data:", reqData); // Debug line 3
            // ... (rest of your build table code)
        });

        tableBody.innerHTML = tableHTML;

    } catch (error) {
        console.error("Critical Error:", error); // This will show in the F12 console
        tableBody.innerHTML = "<tr><td colspan='7' style='text-align: center; color: red;'>Error: " + error.message + "</td></tr>";
    }
}

        // IMPROVED FILTER: Now handles "Pending", "In Progress", and "Completed"
        window.filterTable = function() {
            const searchText = document.getElementById("searchInput").value.toLowerCase();
            const statusFilter = document.getElementById("statusFilter").value;
            const tr = document.getElementById("recordTableBody").getElementsByTagName("tr");

            for (let i = 0; i < tr.length; i++) {
                const rowText = tr[i].textContent.toLowerCase();
                const statusBadge = tr[i].querySelector('.badge');
                if (!statusBadge) continue;
                
                const badgeText = statusBadge.innerText.toLowerCase();
                
                const matchesSearch = rowText.includes(searchText);
                const matchesStatus = (statusFilter === "all") || 
                                      (statusFilter === "completed" && badgeText.includes("completed")) ||
                                      (statusFilter === "pending" && (badgeText.includes("pending") || badgeText.includes("progress")));

                tr[i].style.display = (matchesSearch && matchesStatus) ? "" : "none";
            }
        };
    </script>
</body>
</html>
