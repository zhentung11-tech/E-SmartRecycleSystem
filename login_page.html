<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Smart Recycle - Login</title>
    
    <link rel="stylesheet" href="login_page.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

    <header class="top-nav-green">
        <div class="logo-section-top">
            <img src="logo.png" alt="Logo" style="width: 45px; height: auto;">
            <h1>E-Smart Recycle</h1>
        </div>
        <div class="user-profile-top">
            <div class="profile-circle-gray">
                <i class="fas fa-user"></i>
            </div>
        </div>
    </header>

    <div class="layout-container">
        
        <aside class="sidebar-left">
            <ul class="sidebar-menu">
                <li><a href="#"><i class="fas fa-home"></i> Dashboard</a></li>
                <li><a href="#"><i class="fas fa-box"></i> Submit Item</a></li>
                <li><a href="#"><i class="fas fa-history"></i> Request History</a></li>
                <li><a href="#"><i class="fas fa-bell"></i> Notification</a></li>
            </ul>
        </aside>

        <main class="main-content">
            <div class="login-card">
                
                <div class="form-header">
                    <img src="logo.png" alt="Logo" style="width: 50px; height: auto;">
                    <h2>E-Smart Recycle<br><span>System</span></h2>
                </div>

                <div class="login-title">Login</div>

                <form id="loginForm">
                    <div class="input-group">
                        <label>Email</label>
                        <input type="email" id="email" placeholder="Email" required>
                    </div>

                    <div class="input-group" style="margin-bottom: 10px;">
                        <label>Password</label>
                        <input type="password" id="password" placeholder="xxxx" required>
                    </div>

                    <div style="text-align: right; margin-bottom: 20px;">
                        <a href="#" onclick="forgotPassword(event)" style="color: #00B050; text-decoration: none; font-size: 13px; font-weight: bold; font-family: 'Georgia', serif;">Forgot Password?</a>
                    </div>

                    <div class="options-row">
                        <div class="remember-me">
                            <input type="checkbox" id="remember">
                            <label for="remember">Remember me</label>
                        </div>
                        <div class="role-selector">
                            <input type="radio" id="roleUser" name="role" value="user" checked>
                            <label for="roleUser">User</label>
                            <input type="radio" id="roleCollector" name="role" value="collector">
                            <label for="roleCollector">Collector</label>
                        </div>
                    </div>

                    <button type="submit" class="btn-login" id="loginBtn">Login</button>

                    <div class="signup-link">
                        Don't have an account? <a href="signup.html">Sign up</a>
                    </div>
                </form>

            </div>
        </main>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-app.js";
        
        // Imported sendPasswordResetEmail
        import { getAuth, signInWithEmailAndPassword, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-auth.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore.js";

        // Your exact Firebase config
        const firebaseConfig = {
            apiKey: "AIzaSyC5yA_CKK4xZ8bsx-Qutca7lym6i5oJdpo",
            authDomain: "e-smartrecyclesystem.firebaseapp.com",
            projectId: "e-smartrecyclesystem",
            storageBucket: "e-smartrecyclesystem.firebasestorage.app",
            messagingSenderId: "212695525607",
            appId: "1:212695525607:web:61d0df7011aa8baf265a42"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // --- NEW FORGOT PASSWORD FUNCTION ---
        window.forgotPassword = function(event) {
            event.preventDefault(); // Prevents page jumping

            const emailInput = document.getElementById('email').value;

            // Ensure they typed an email before clicking
            if (!emailInput) {
                alert("Please type your Email address into the box first, then click 'Forgot Password?'.");
                return;
            }

            // Send the Firebase Reset Email
            sendPasswordResetEmail(auth, emailInput)
                .then(() => {
                    alert("Password reset email sent! Please check your inbox (and spam folder) for the link.");
                })
                .catch((error) => {
                    alert("Error: " + error.message);
                });
        };

        // --- SECURE LOGIN FUNCTION ---
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const loginBtn = document.getElementById('loginBtn');

            loginBtn.innerText = "Logging in...";
            loginBtn.disabled = true;

            try {
                // 1. Authenticate with Firebase
                const userCredential = await signInWithEmailAndPassword(auth, email, password);
                const user = userCredential.user;

                // 2. Fetch the user's role securely from Firestore
                const userRef = doc(db, "users", user.uid);
                const docSnap = await getDoc(userRef);

                if (docSnap.exists()) {
                    const dbRole = docSnap.data().role;

                    // 3. Auto-Redirect based on true database role
                    if (dbRole === 'admin') {
                        window.location.href = "admin_dashboard.html";
                    } else if (dbRole === 'collector') {
                        window.location.href = "collector_dashboard.html";
                    } else {
                        window.location.href = "dashboard.html"; // Normal User
                    }
                } else {
                    alert("User profile not found in database.");
                    loginBtn.innerText = "Login";
                    loginBtn.disabled = false;
                }

            } catch (error) {
                alert("Login Failed: " + error.message);
                loginBtn.innerText = "Login";
                loginBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
