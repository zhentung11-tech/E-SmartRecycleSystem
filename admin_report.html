<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Smart Recycle - Admin Reports</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="admin_report.css">
    <style>
        .top-nav-green { background-color: #8CC63F; display: flex; justify-content: space-between; align-items: center; padding: 10px 30px; height: 60px; }
        .logo-section-top { display: flex; align-items: center; gap: 15px; }
        .user-profile-top { position: relative; cursor: pointer; display: flex; align-items: center; gap: 10px; }
        .profile-dropdown { display: none; position: absolute; top: 55px; right: 0; background-color: white; min-width: 160px; box-shadow: 0 4px 15px rgba(0,0,0,0.2); border-radius: 6px; z-index: 1000; flex-direction: column; }
        .show-dropdown { display: flex !important; }
        .card { background: #f9f9f9; padding: 15px; border-radius: 8px; flex: 1; border: 1px solid #ddd; text-align: center; }
        .card-value { font-size: 1.5rem; font-weight: bold; color: #1a8a4c; }
        .summary-cards { display: flex; gap: 20px; margin-bottom: 30px; }
    </style>
</head>
<body>
    <div class="app-container">
        <header class="top-nav-green">
            <div class="logo-section-top">
                <img src="logo.png" style="width: 50px;">
                <a href="admin_dashboard.html" style="text-decoration: none; color: black;"><h1>E-Smart Recycle</h1></a>
            </div>
            <div class="user-profile-top" onclick="toggleProfileMenu()">
                <span id="userNameDisplay">Loading...</span>
                <div class="profile-circle-gray"><i class="fas fa-user-shield"></i></div>
                <div id="profileDropdown" class="profile-dropdown">
                    <a href="admin_profile.html">Profile</a>
                    <a href="#" onclick="logoutUser(event)">Logout</a>
                </div>
            </div>
        </header>

        <nav class="navbar" style="background-color: #0f7a45; display: flex; padding: 10px;">
            <a href="admin_dashboard.html" class="nav-link">Dashboard</a>
            <a href="adminusermanagement.html" class="nav-link">Account</a>
            <a href="collect_record.html" class="nav-link">Collector Records</a>
            <a href="admin_report.html" class="nav-link active">Reports</a>
        </nav>

        <main class="main-content" style="padding: 40px; display: flex; justify-content: center;">
            <div class="content-card" style="width: 100%; max-width: 1100px; background: white; padding: 30px;">
                <h1>System Reports</h1>
                <div class="controls">
                    <select class="dropdown" id="reportTypeSelect">
                        <option value="" disabled selected>Select Report Type</option>
                        <option value="Collection Summary">Collection Summary</option>
                        <option value="User Summary">User Data Summary</option>
                        <option value="Collector Performance">Collector Performance</option>
                    </select>
                    <select class="dropdown" id="dateRangeSelect">
                        <option value="All Time">All Time</option>
                        <option value="Today">Today</option>
                        <option value="Last 7 Days">Last 7 Days</option>
                        <option value="Last 30 Days">Last 30 Days</option>
                    </select>
                    <button class="btn-generate" id="generateBtn" onclick="generateAdminReport()">Generate Report</button>
                    <button class="btn-export" onclick="window.print()"><i class="fa-solid fa-download"></i> Export PDF</button>
                </div>

                <hr class="divider">

                <div id="reportResult" style="display: none;">
                    <h2 id="reportTitle">Report</h2>
                    <div class="summary-cards" id="dynamicSummaryCards"></div>
                    <table style="width:100%; border-collapse: collapse;">
                        <thead id="dynamicTableHeader"></thead>
                        <tbody id="reportTableBody"></tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-auth.js";
        import { getFirestore, doc, getDoc, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore.js";

        const db = getFirestore(initializeApp({ 
            apiKey: "AIzaSyC5yA_CKK4xZ8bsx-Qutca7lym6i5oJdpo",
            authDomain: "e-smartrecyclesystem.firebaseapp.com",
            projectId: "e-smartrecyclesystem",
            storageBucket: "e-smartrecyclesystem.firebasestorage.app",
            messagingSenderId: "212695525607",
            appId: "1:212695525607:web:61d0df7011aa8baf265a42"
        }));

        window.generateAdminReport = async function() {
    const reportType = document.getElementById('reportTypeSelect').value;
    const dateRange = document.getElementById('dateRangeSelect').value;
    const tbody = document.getElementById('reportTableBody');
    const summaryContainer = document.getElementById('dynamicSummaryCards');
    const thead = document.getElementById('dynamicTableHeader');
    const reportResult = document.getElementById('reportResult');

    // Reset UI
    tbody.innerHTML = ""; 
    summaryContainer.innerHTML = "";
    reportResult.style.display = 'block'; // Force show to see if data exists
    
    console.log("Generating report for:", reportType, "Range:", dateRange);

    const now = new Date();
    let startTime = 0;
    if (dateRange === "Today") startTime = new Date(now.setHours(0,0,0,0)).getTime();
    else if (dateRange === "Last 7 Days") startTime = now.getTime() - (7 * 24 * 60 * 60 * 1000);
    else if (dateRange === "Last 30 Days") startTime = now.getTime() - (30 * 24 * 60 * 60 * 1000);

    try {
        if (reportType === "Collection Summary") {
            thead.innerHTML = `<tr><th>Date</th><th>Item</th><th>Weight</th><th>Status</th></tr>`;
            const reqs = await getDocs(collection(db, "request"));
            console.log("Total requests found:", reqs.size);
            
            let totalC = 0, totalW = 0;
            reqs.forEach(d => {
                const data = d.data();
                const time = getTimestamp(data.updatedAt || data.createdAt);
                if (startTime > 0 && time < startTime) return;
                
                totalC++; 
                totalW += Number(data.weight) || 0;
                tbody.innerHTML += `<tr><td>${new Date(time).toLocaleDateString()}</td><td>${data.category || '-'}</td><td>${data.weight || 0}kg</td><td>${data.status || '-'}</td></tr>`;
            });
            summaryContainer.innerHTML = `<div class="card"><h3>Total Tasks</h3><p class="card-value">${totalC}</p></div><div class="card"><h3>Total Weight</h3><p class="card-value">${totalW.toFixed(2)}kg</p></div>`;
        } 
        else if (reportType === "User Summary") {
            thead.innerHTML = `<tr><th>Name</th><th>Email</th><th>Phone</th></tr>`;
            const users = await getDocs(collection(db, "users"));
            users.forEach(u => {
                const d = u.data();
                if(d.role === "user") {
                    tbody.innerHTML += `<tr><td>${d.fullName || 'N/A'}</td><td>${d.email || 'N/A'}</td><td>${d.phone || 'N/A'}</td></tr>`;
                }
            });
        }
        else if (reportType === "Collector Performance") {
            thead.innerHTML = `<tr><th>Name</th><th>Phone</th><th>Tasks Done</th><th>Total Weight</th></tr>`;
            const [users, reqs] = await Promise.all([getDocs(collection(db, "users")), getDocs(collection(db, "request"))]);
            
            users.forEach(u => {
                const ud = u.data();
                if(ud.role === "collector") {
                    const completed = reqs.docs.filter(r => r.data().collectorId === u.id && r.data().status === "completed");
                    const totalW = completed.reduce((sum, r) => sum + Number(r.data().weight || 0), 0);
                    tbody.innerHTML += `<tr><td>${ud.fullName}</td><td>${ud.phone}</td><td>${completed.length}</td><td>${totalW.toFixed(2)}kg</td></tr>`;
                }
            });
        }
    } catch (e) { 
        console.error("Report Error:", e); 
        alert("Error loading data. Check Console."); 
    }
};

        window.toggleProfileMenu = () => document.getElementById("profileDropdown").classList.toggle("show-dropdown");
        window.logoutUser = (e) => { e.preventDefault(); signOut(getAuth()).then(() => window.location.href = "login_page.html"); };
    </script>
</body>
</html>
