<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Smart Recycle - Admin Reports</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; background-color: #C4C4C4; }
        .top-nav-green { background-color: #8CC63F; display: flex; justify-content: space-between; align-items: center; padding: 10px 30px; height: 60px; }
        .navbar { background-color: #0f7a45; display: flex; padding: 10px; }
        .nav-link { color: white; text-decoration: none; padding: 10px 20px; }
        .nav-link.active { background-color: #149c57; }
        .content-card { background: white; padding: 30px; border-radius: 4px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 90%; max-width: 1100px; margin: 20px auto; }
        .controls { margin-bottom: 20px; display: flex; gap: 10px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 12px; text-align: left; }
        th { background-color: #f2f2f2; }
    </style>
</head>
<body>

    <header class="top-nav-green">
        <div style="display: flex; align-items: center; gap: 15px;">
            <img src="logo.png" style="width: 50px;">
            <h1 style="margin:0; font-size: 22px;">E-Smart Recycle</h1>
        </div>
        <div id="userNameDisplay">Loading...</div>
    </header>

    <nav class="navbar">
        <a href="admin_dashboard.html" class="nav-link">Dashboard</a>
        <a href="admin_report.html" class="nav-link active">Reports</a>
    </nav>

    <main>
        <div class="content-card">
            <h1>System Reports</h1>
            <div class="controls">
                <select id="reportTypeSelect">
                    <option value="" disabled selected>Select Report Type</option>
                    <option value="Collection Summary">Collection Summary</option>
                    <option value="Account Summary">Account Summary</option>
                </select>
                <select id="dateRangeSelect">
                    <option value="All Time">All Time</option>
                    <option value="Today">Today</option>
                    <option value="Last 7 Days">Last 7 Days</option>
                    <option value="Last 30 Days">Last 30 Days</option>
                </select>
                <button id="generateBtn" onclick="generateAdminReport()">Generate Report</button>
                <button onclick="exportPDF()">Export PDF</button>
            </div>

            <div id="reportResult" style="display: none; margin-top: 20px;">
                <h2 id="reportTitle">Report</h2>
                <table>
                    <thead id="dynamicTableHeader"></thead>
                    <tbody id="reportTableBody"></tbody>
                </table>
            </div>
        </div>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-auth.js";
        import { getFirestore, doc, getDoc, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore.js";

        const db = getFirestore(initializeApp({ 
            apiKey: "AIzaSyC5yA_CKK4xZ8bsx-Qutca7lym6i5oJdpo",
            authDomain: "e-smartrecyclesystem.firebaseapp.com",
            projectId: "e-smartrecyclesystem",
            storageBucket: "e-smartrecyclesystem.firebasestorage.app",
            messagingSenderId: "212695525607",
            appId: "1:212695525607:web:61d0df7011aa8baf265a42"
        }));

        onAuthStateChanged(getAuth(), async (user) => {
            if (!user) { window.location.href = "login_page.html"; return; }
            const snap = await getDoc(doc(db, "users", user.uid));
            if (snap.exists() && snap.data().role?.toLowerCase() === "admin") {
                document.getElementById('userNameDisplay').innerText = snap.data().fullName || "Admin";
            } else { window.location.href = "login_page.html"; }
        });

        const getTimestamp = (val) => {
    if (!val) return 0;
    // If it's a Firestore Timestamp
    if (val.toDate) return val.toDate().getTime();
    // If it's a String or number
    return new Date(val).getTime();
};
        
window.generateAdminReport = async function() {
    // ... (rest of your declarations)
    
    // 1. IMPROVED DATE RANGE CALCULATIONS
    const now = new Date();
    let startTime = 0;
    let endTime = Infinity; 

    if (range === "Today") {
        startTime = new Date(now.setHours(0,0,0,0)).getTime();
    } else if (range === "Last 7 Days") {
        startTime = now.getTime() - (7 * 24 * 60 * 60 * 1000);
    } else if (range === "Last 30 Days") {
        startTime = now.getTime() - (30 * 24 * 60 * 60 * 1000);
    } 
    // "All Time" is handled by startTime = 0

    try {
        tbody.innerHTML = "";
        const [users, reqs] = await Promise.all([getDocs(collection(db, "users")), getDocs(collection(db, "request"))]);

        if (type === "Collection Summary") {
            thead.innerHTML = `<tr><th>Date</th><th>Item</th><th>Weight</th><th>Status</th></tr>`;
            reqs.forEach(d => {
                const data = d.data();
                const time = getTimestamp(data.createdAt); // Use helper here!
                
                if (time >= startTime && time <= endTime) {
                    tbody.innerHTML += `<tr><td>${new Date(time).toLocaleDateString()}</td><td>${data.category || '-'}</td><td>${data.weight || 0} kg</td><td>${data.status || '-'}</td></tr>`;
                }
            });
        } 
        else if (type === "Account Summary") {
            // ... (Inside Account Summary loop)
            users.forEach(u => {
                const d = u.data();
                const time = getTimestamp(d.createdAt); // Use helper here!
                
                if (time >= startTime && time <= endTime) {
                    // ... your existing display logic
                }
            });
                    tbody.innerHTML += `<tr><td colspan="4" style="background:#f8f9fa; font-weight:bold;">COLLECTOR PERFORMANCE</td></tr>
                                        <tr><th>Name</th><th>Phone</th><th>Tasks</th><th>Total Weight</th></tr>`;
                    users.forEach(u => {
                        const ud = u.data();
                        if (ud.role?.toLowerCase() === "collector") {
                            const completed = reqs.docs.filter(r => {
                                const rData = r.data();
                                const rTime = rData.createdAt?.toDate ? rData.createdAt.toDate().getTime() : new Date(rData.createdAt).getTime();
                                return rData.collectorId === u.id && rData.status?.toLowerCase() === "completed" && (range === "All Time" || (rTime >= startTime && rTime <= endTime));
                            });
                            const totalW = completed.reduce((sum, r) => sum + Number(r.data().weight || 0), 0);
                            if (completed.length > 0 || range === "All Time") {
                                tbody.innerHTML += `<tr><td>${ud.fullName || 'N/A'}</td><td>${ud.phone || 'N/A'}</td><td>${completed.length}</td><td>${totalW.toFixed(2)} kg</td></tr>`;
                            }
                        }
                    });
                }
                document.getElementById('reportResult').style.display = 'block';
            } catch (e) { console.error(e); alert("Error loading data."); }
            btn.innerText = "Generate Report"; btn.disabled = false;
        };

        window.exportPDF = () => {
            const el = document.getElementById('reportResult');
            if(el.style.display === 'none') { alert("Generate report first!"); return; }
            html2pdf().from(el).save('Report.pdf');
        };
    </script>
</body>
</html>
