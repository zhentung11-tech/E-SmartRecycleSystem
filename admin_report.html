<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Smart Recycle - Admin Reports</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="admin_report.css">
    <style>
        .top-nav-green { background-color: #8CC63F; display: flex; justify-content: space-between; align-items: center; padding: 10px 30px; height: 60px; }
        .logo-section-top { display: flex; align-items: center; gap: 15px; }
        .logo-section-top img { width: 50px; }
        .user-profile-top { position: relative; cursor: pointer; display: flex; align-items: center; gap: 10px; }
        .profile-dropdown { display: none; position: absolute; top: 55px; right: 0; background-color: white; min-width: 160px; box-shadow: 0 4px 15px rgba(0,0,0,0.2); border-radius: 6px; z-index: 1000; flex-direction: column; }
        .show-dropdown { display: flex !important; }
        .card { background: #f9f9f9; padding: 15px; border-radius: 8px; flex: 1; border: 1px solid #ddd; text-align: center; }
        .card-value { font-size: 1.5rem; font-weight: bold; color: #1a8a4c; }
        .summary-cards { display: flex; gap: 20px; margin-bottom: 30px; }
    </style>
</head>
<body>

    <div class="app-container" style="max-width: 100%;">
        <header class="top-nav-green">
            <div class="logo-section-top">
                <img src="logo.png" alt="Logo">
                <a href="admin_dashboard.html" style="text-decoration: none; color: black;"><h1>E-Smart Recycle</h1></a>
            </div>
            <div class="user-profile-top" onclick="toggleProfileMenu()">
                <span id="userNameDisplay">Loading...</span>
                <div class="profile-circle-gray"><i class="fas fa-user-shield"></i></div>
                <div id="profileDropdown" class="profile-dropdown">
                    <a href="admin_profile.html">Profile</a>
                    <a href="#" onclick="logoutUser(event)">Logout</a>
                </div>
            </div>
        </header>

        <nav class="navbar" style="background-color: #0f7a45; display: flex; padding: 10px;">
            <a href="admin_dashboard.html" class="nav-link"><i class="fa-solid fa-house"></i> Dashboard</a>
            <a href="adminusermanagement.html" class="nav-link"><i class="fa-regular fa-user"></i> Account</a>
            <a href="collect_record.html" class="nav-link"><i class="fa-solid fa-clipboard-list"></i> Collector Records</a>
            <a href="admin_report.html" class="nav-link active"><i class="fa-solid fa-chart-bar"></i> Reports</a>
        </nav>

        <main class="main-content" style="padding: 40px; display: flex; justify-content: center;">
            <div class="content-card" style="width: 100%; max-width: 1100px; background: white; padding: 30px;">
                <h1>System Reports</h1>
                <div class="controls">
                    <select class="dropdown" id="reportTypeSelect">
                        <option value="" disabled selected>Select Report Type</option>
                        <option value="Collection Summary">Collection Summary</option>
                        <option value="User Summary">User Data Summary</option>
                        <option value="Collector Performance">Collector Performance</option>
                    </select>
                    <select class="dropdown" id="dateRangeSelect">
                        <option value="All Time">All Time</option>
                        <option value="Today">Today</option>
                        <option value="Last 7 Days">Last 7 Days</option>
                        <option value="Last 30 Days">Last 30 Days</option>
                    </select>
                    <button class="btn-generate" id="generateBtn" onclick="generateAdminReport()">Generate Report</button>
                    <button class="btn-export" onclick="window.print()"><i class="fa-solid fa-download"></i> Export PDF</button>
                </div>

                <hr class="divider">

                <div id="reportResult" style="display: none;">
                    <h2 id="reportTitle">Report</h2>
                    <div class="summary-cards" id="dynamicSummaryCards"></div>
                    <div class="table-wrapper">
                        <table>
                            <thead id="dynamicTableHeader"></thead>
                            <tbody id="reportTableBody"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-auth.js";
        import { getFirestore, doc, getDoc, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore.js";

        const db = getFirestore(initializeApp({ 
            apiKey: "AIzaSyC5yA_CKK4xZ8bsx-Qutca7lym6i5oJdpo",
            authDomain: "e-smartrecyclesystem.firebaseapp.com",
            projectId: "e-smartrecyclesystem",
            storageBucket: "e-smartrecyclesystem.firebasestorage.app",
            messagingSenderId: "212695525607",
            appId: "1:212695525607:web:61d0df7011aa8baf265a42"
        }));

        onAuthStateChanged(getAuth(), async (user) => {
            if (!user) { window.location.href = "login_page.html"; return; }
            const snap = await getDoc(doc(db, "users", user.uid));
            if (snap.exists() && snap.data().role === "admin") {
                document.getElementById('userNameDisplay').innerText = snap.data().fullName;
            } else { window.location.href = "login_page.html"; }
        });

        // Helper: Consistent date conversion
        const getTimestamp = (val) => val?.toDate ? val.toDate().getTime() : new Date(val).getTime();

        window.generateAdminReport = async function() {
    const reportType = document.getElementById('reportTypeSelect').value;
    const dateRange = document.getElementById('dateRangeSelect').value;
    const generateBtn = document.getElementById('generateBtn');

    if (!reportType || !dateRange) { alert("Please select both a Report Type and a Date Range."); return; }

    generateBtn.innerText = "Generating...";
    generateBtn.disabled = true;

    // --- DATE RANGE CALCULATIONS ---
    const now = new Date();
    let startTime = 0;
    let endTime = new Date().getTime(); // Defaults to "now"

    if (dateRange === "Today") {
        const startOfToday = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 0, 0, 0);
        startTime = startOfToday.getTime();
        // endTime is already "now"
    } else if (dateRange === "Last 7 Days") {
        startTime = now.getTime() - (7 * 24 * 60 * 60 * 1000);
    } else if (dateRange === "Last 30 Days") {
        startTime = now.getTime() - (30 * 24 * 60 * 60 * 1000);
    } else if (dateRange === "This Month") {
        startTime = new Date(now.getFullYear(), now.getMonth(), 1).getTime();
    } else {
        // "All Time"
        startTime = 0;
        endTime = Infinity; 
    }

    try {
        const tbody = document.getElementById('reportTableBody');
        const summaryContainer = document.getElementById('dynamicSummaryCards');
        tbody.innerHTML = ""; 
        summaryContainer.innerHTML = "";

        // Fetch Data
        const requestSnap = await getDocs(collection(db, "request"));
        let tableHTML = "";
        let totalCount = 0;
        let totalWeight = 0;

        requestSnap.forEach((docSnap) => {
            const data = docSnap.data();
            
            // Convert Firestore Timestamp or String Date to number
            const recordTime = data.createdAt?.toDate ? data.createdAt.toDate().getTime() : new Date(data.createdAt || data.updatedAt).getTime();
            
            // Filter: Only include if within range
            if (recordTime >= startTime && recordTime <= endTime) {
                totalCount++;
                totalWeight += Number(data.weight) || 0;
                
                tableHTML += `
                    <tr>
                        <td>${new Date(recordTime).toLocaleDateString()}</td>
                        <td>${data.category || '-'}</td>
                        <td>${data.weight || '0'} kg</td>
                        <td><span class="badge ${data.status}">${data.status || 'pending'}</span></td>
                    </tr>
                `;
            }
        });

        tbody.innerHTML = tableHTML || "<tr><td colspan='4' style='text-align:center;'>No records found for this range.</td></tr>";
        
        // Update Summary
        if (reportType === "Collection Summary") {
            summaryContainer.innerHTML = `
                <div class="card"><h3>Total Tasks</h3><p class="card-value">${totalCount}</p></div>
                <div class="card"><h3>Total Weight</h3><p class="card-value">${totalWeight.toFixed(2)} kg</p></div>
            `;
        }

        document.getElementById('reportResult').style.display = 'block';
    } catch (err) {
        console.error("Report Error:", err);
        alert("Failed to generate report.");
    }

    generateBtn.innerText = "Generate Report";
    generateBtn.disabled = false;
};

// Add this logic into your generateAdminReport function

// ----------------------------------------------------
// LOGIC B: USER SUMMARY (Only shows users with role "user")
// ----------------------------------------------------
else if (reportType === "User Summary") {
    summaryContainer.innerHTML = `
        <div class="card"><h3>Total Users</h3><p class="card-value" id="totalUsers">0</p></div>
    `;
    theadContainer.innerHTML = `<tr><th>User ID</th><th>Full Name</th><th>Email</th><th>Phone</th></tr>`;

    const querySnapshot = await getDocs(collection(window.db, "users"));
    let userCount = 0;

    querySnapshot.forEach((docSnap) => {
        const userData = docSnap.data();
        // Only include those where role is 'user' (not admin or collector)
        if (userData.role === "user") {
            userCount++;
            const shortId = "#" + docSnap.id.substring(0, 6).toUpperCase();
            
            tableHTML += `
                <tr>
                    <td style="font-weight: bold; color: #555;">${shortId}</td>
                    <td>${userData.fullName || 'N/A'}</td>
                    <td>${userData.email || 'N/A'}</td>
                    <td>${userData.phone || 'N/A'}</td>
                </tr>
            `;
        }
    });
    document.getElementById('totalUsers').innerText = userCount;
    tbodyContainer.innerHTML = tableHTML;
}

// ----------------------------------------------------
// LOGIC C: COLLECTOR PERFORMANCE (Only shows users with role "collector")
// ----------------------------------------------------
else if (reportType === "Collector Performance") {
    summaryContainer.innerHTML = `
        <div class="card"><h3>Active Collectors</h3><p class="card-value" id="perfActiveCollectors">0</p></div>
        <div class="card"><h3>Total Tasks Completed</h3><p class="card-value" id="perfTotalJobs">0</p></div>
    `;
    theadContainer.innerHTML = `<tr><th>Collector Name</th><th>Phone</th><th>Jobs Completed</th><th>Total Weight</th></tr>`;

    // 1. Get all collectors
    const usersSnap = await getDocs(collection(window.db, "users"));
    const collectors = [];
    
    usersSnap.forEach(doc => {
        const data = doc.data();
        if(data.role === "collector") {
            collectors.push({ id: doc.id, name: data.fullName, phone: data.phone, jobs: 0, weight: 0 });
        }
    });

    // 2. Get all requests and match them
    const reqSnap = await getDocs(collection(window.db, "request"));
    reqSnap.forEach(docSnap => {
        const reqData = docSnap.data();
        const collector = collectors.find(c => c.id === reqData.collectorId);
        
        if (collector && reqData.status === "completed") {
            collector.jobs += 1;
            collector.weight += Number(reqData.weight) || 0;
        }
    });

    // 3. Build Table
    collectors.forEach(c => {
        tableHTML += `
            <tr>
                <td>${c.name}</td>
                <td>${c.phone}</td>
                <td>${c.jobs}</td>
                <td>${c.weight.toFixed(2)} kg</td>
            </tr>
        `;
    });
    
    document.getElementById('perfActiveCollectors').innerText = collectors.length;
    document.getElementById('perfTotalJobs').innerText = collectors.reduce((sum, c) => sum + c.jobs, 0);
    tbodyContainer.innerHTML = tableHTML;
}
        
        window.toggleProfileMenu = () => document.getElementById("profileDropdown").classList.toggle("show-dropdown");
        window.logoutUser = (e) => { e.preventDefault(); signOut(getAuth()).then(() => window.location.href = "login_page.html"); };
    </script>
</body>
</html>
