<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Smart Recycle - User Dashboard</title>
    <link rel="stylesheet" href="dashstyle.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        /* Exact Dropdown Styling to match the rest of your system */
        .profile-dropdown-container {
            position: relative;
            display: inline-block;
            font-family: Arial, sans-serif;
        }
        
        .dropdown-menu {
            display: none;
            position: absolute;
            right: 0;
            top: 50px;
            background-color: white;
            min-width: 160px;
            box-shadow: 0px 4px 12px rgba(0,0,0,0.15);
            border-radius: 4px;
            z-index: 1000;
            overflow: hidden;
            flex-direction: column;
        }

        .dropdown-menu.show {
            display: flex;
        }

        .dropdown-menu a {
            color: #333;
            padding: 12px 20px;
            text-decoration: none;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: background-color 0.2s;
        }

        .dropdown-menu a:hover {
            background-color: #f5f5f5;
        }

        .dropdown-menu hr {
            margin: 0;
            border: none;
            border-top: 1px solid #eee;
        }

        .profile-circle-gray {
            background-color: #545454;
            color: white;
            width: 35px;
            height: 35px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 16px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <header class="top-nav">
        <div class="logo-section">
            <img src="logo.png" alt="E-Smart Recycle Logo" class="nav-logo">
            <a href="dashboard.html" style="text-decoration: none;"><h1>E-Smart Recycle</h1></a>
        </div>
        
        <div class="user-profile-top" style="display: flex; align-items: center; gap: 10px; font-family: Arial, sans-serif;">
            <span id="userNameDisplay">Loading...</span>
            <div class="profile-dropdown-container">
                <div class="profile-circle-gray" onclick="toggleDropdown()">
                    <i class="fas fa-user"></i>
                </div>
                
                <div class="dropdown-menu" id="profileDropdown">
                    <a href="user_profile.html"><i class="fas fa-user-circle"></i> Profile</a>
                    <hr>
                    <a href="login_page.html" onclick="logoutUser(event)"><i class="fas fa-sign-out-alt"></i> Logout</a>
                </div>
            </div>
        </div>
    </header>

<nav class="sub-menu">
    <ul class="nav-links">
        <li><a href="dashboard.html" class="nav-item active"><i class="fas fa-home"></i> Dashboard</a></li>
        <li><a href="selectpickup.html" class="nav-item"><i class="fas fa-box"></i> Submit item</a></li>
        <li><a href="user_history.html" class="nav-item"><i class="fas fa-history"></i> Request History</a></li>
        
        <li><a href="user_feedback.html" class="nav-item"><i class="fas fa-star"></i> Rate Service</a></li>
        
        <li><a href="user_notification.html" class="nav-item"><i class="fas fa-bell"></i> Notification</a></li>
    </ul>
</nav>

    <main class="dashboard-container">
        <div class="stats-row">
            <div class="stat-card">
                <h3>Total Requests</h3>
                <p id="total-requests">0</p>
            </div>
            <div class="stat-card">
                <h3>Pending</h3>
                <p id="pending-requests">0</p>
            </div>
            <div class="stat-card">
                <h3>Completed Requests</h3>
                <p id="completed-requests">0</p>
            </div>
        </div>

        <div class="action-section">
            <a href="selectpickup.html" class="btn-submit-large" style="display: block; text-align: center; text-decoration: none; box-sizing: border-box;" aria-label="Submit a new recyclable item">
                Submit Recyclable Item
            </a>
        </div>
        
        <div class="table-section">
            <h2 class="serif-heading">Recent Requests</h2>
            <div class="table-responsive">
                <table class="requests-table">
                    <thead>
                        <tr>
                            <th>Date</th>
                            <th>Item Type</th>
                            <th>Quantity</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody id="recentRequestsTableBody">
                        <tr>
                            <td colspan="4" style="text-align: center; padding: 20px;">No recent requests yet. Start recycling!</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-auth.js";
    import { getFirestore, doc, getDoc, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyC5yA_CKK4xZ8bsx-Qutca7lym6i5oJdpo",
        authDomain: "e-smartrecyclesystem.firebaseapp.com",
        projectId: "e-smartrecyclesystem",
        storageBucket: "e-smartrecyclesystem.firebasestorage.app",
        messagingSenderId: "212695525607",
        appId: "1:212695525607:web:61d0df7011aa8baf265a42"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    // IMPROVED: Role-based Authentication Guard
    onAuthStateChanged(auth, async (user) => {
        if (!user) {
            // No user logged in, send to login
            window.location.href = "login_page.html";
            return;
        }

        try {
            // 1. Fetch user data from Firestore to verify role
            const userRef = doc(db, "users", user.uid);
            const userSnap = await getDoc(userRef);

            if (userSnap.exists()) {
                const userData = userSnap.data();
                
                // SECURITY: If user is actually a collector, redirect them to their portal
                if (userData.role === "collector") {
                    alert("Unauthorized: Collectors must use the Collector Dashboard.");
                    window.location.href = "collector_dashboard.html";
                    return;
                }

                // If authorized as a normal user, render content
                document.getElementById('userNameDisplay').innerText = userData.fullName || "User";
                loadDashboardData(user.uid);
                }
                } catch (error) {
                    console.error("Auth Guard Error:", error);
                    window.location.href = "login_page.html";
                }
            });
        
            // 2. Separate logic for loading dashboard stats
            async function loadDashboardData(userId) {
                const q = query(collection(db, "request"), where("userId", "==", userId));
                const querySnapshot = await getDocs(q);
        
                let total = 0, pending = 0, completed = 0;
                let tableHTML = "";
        
                querySnapshot.forEach((docSnap) => {
                    const data = docSnap.data();
                    total++;
                    
                    const status = data.status ? data.status.toLowerCase() : "pending";
                    if (status === "pending" || status === "accepted") pending++;
                    if (status === "completed") completed++;
        
                    const displayDate = data.scheduledDate ? data.scheduledDate.substring(0, 10) : "Recent";
                    
                    tableHTML += `
                        <tr>
                            <td>${displayDate}</td>
                            <td>${data.category || '-'}</td>
                            <td>${data.weight || '0'} Kg</td>
                            <td><span class="status-badge ${status}">${status.charAt(0).toUpperCase() + status.slice(1)}</span></td>
                        </tr>
                    `;
                });
        
                document.getElementById('total-requests').innerText = total;
                document.getElementById('pending-requests').innerText = pending;
                document.getElementById('completed-requests').innerText = completed;
                document.getElementById('recentRequestsTableBody').innerHTML = tableHTML || "<tr><td colspan='4' style='text-align: center; padding: 20px;'>No requests found.</td></tr>";
            }
        
            // --- UTILS ---
            window.toggleDropdown = () => document.getElementById("profileDropdown").classList.toggle("show");
            window.logoutUser = async (event) => {
                event.preventDefault();
                if (confirm("Are you sure you want to log out?")) {
                    await signOut(auth);
                    window.location.href = "login_page.html";
                }
            };
        
        
            // --- Inside your script where you fetch requests for the dashboard ---
        
        const TWO_MINUTES_AGO = new Date().getTime() - (2 * 60 * 1000); // Adjust to (3 * 24 * 60 * 60 * 1000) later
        
        snapshot.forEach((doc) => {
            const data = doc.data();
            const requestTime = data.createdAt?.toDate ? data.createdAt.toDate().getTime() : new Date(data.createdAt).getTime();
            
            // Determine status for display
            let displayStatus = data.status || "pending";
            let statusClass = "status-pending"; // Your CSS class for styling
        
            // EXPIRATION LOGIC: If it's pending and older than the limit, mark as expired
            if (displayStatus.toLowerCase() === "pending" && (new Date().getTime() - requestTime > TWO_MINUTES_AGO)) {
                displayStatus = "Expired";
                statusClass = "status-expired"; // Make sure to add this in your CSS
            }
        
            // Now use 'displayStatus' and 'statusClass' to render your dashboard items
            // Example:
            dashboardContainer.innerHTML += `
                <div class="request-card">
                    <p>Item: ${data.category}</p>
                    <p>Status: <span class="${statusClass}">${displayStatus}</span></p>
                </div>
            `;
        });
</script>
</body>
</html>
